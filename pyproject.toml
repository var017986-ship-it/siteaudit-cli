[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteaudit-cli"
version = "0.6.0"
description = "A bounded, low-impact web security checker CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SiteAudit contributors" }]
dependencies = []

[project.scripts]
siteaudit = "siteaudit.cli:main"

[tool.setuptools.packages.find]
include = ["siteaudit*"]

[tool.setuptools.package-data]
siteaudit = ["data/*.json"]
